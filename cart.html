<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giỏ hàng - CyberPhone</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css">

  <!-- MAIN CSS -->
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>

    <header class="header">
        <div class="logo" id="logo">CyberPhone</div> 
        <nav class="nav">
          <a href="cart.html" class="btn btn-primary">Giỏ hàng</a>
          <a href="login.html" class="btn btn-secondary">Đăng nhập</a>
        </nav>
      </header>
        
<main class="container mt-5">
  <h1 class="mb-4">Giỏ hàng của bạn</h1>
  <div id="cartSection">
    <table class="table table-bordered" id="cartTable">
      <thead>
        <tr>
          <th>Sản phẩm</th>
          <th>Số lượng</th>
          <th>Thành tiền</th>
          <th>Hành động</th>
        </tr>
      </thead>
      <tbody>
        <!-- Danh sách sản phẩm sẽ thêm vào đây -->
      </tbody>
    </table>
    <div class="text-end">
      <h4>Tổng tiền: <span id="cartTotal">₫0</span></h4>
      <button id="checkoutBtn" class="btn btn-success">Thanh toán</button>
    </div>
  </div>
</main>

<footer class="footer text-center mt-5">
  <p>© 2025 CyberPhone. Tất cả quyền được bảo lưu.</p>
</footer>

<!-- Thư viện JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const logo = document.getElementById("logo");
    logo.addEventListener("click", () => {
      window.location.href = "index.html";
    });
  });
</script>

<script src="./js/cart.js"></script>

</body>
</html>
