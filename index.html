<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberPhone</title>

    <!-- GOOGLE FONT -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <!-- BS5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css"
        integrity="sha512-HK5fgLBL+xu6dm/Ii3z4xhlSUyZgTT9tuc/hSrtw6uzJOvgRr2a9jyxxT1ely+B+xFAmJKVSTbpM/CuL7qxO8w=="
        crossorigin="anonymous" />

    <!-- Add the slick-theme.css if you want default styling -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"/>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css"/>
 
    <!-- MAIN CSS -->
    <link rel="stylesheet" href="./css/main.css">
</head>

<body>
    <header class="header">
      <div class="logo" id="logo">HLSHop</div>
        <nav class="nav">
            <input type="text" placeholder="Tìm kiếm sản phẩm">
            <a href="cart.html" class="btn btn-light">Giỏ hàng</a>
            <a href="login.html" class="btn btn-secondary">Đăng nhập</a>
        </nav>
    </header>
  
    <section class="slider" id="slider">
        <div class="slider_for">
            <div><img src="./img/dt1.jpg" alt="Image 1"></div>
            <div><img src="./img/dt2.jpg" alt="Image 2"></div>
            <div><img src="./img/laptop-4.jpg" alt="Image 3"></div>
        </div>

    </section>

    <div id="productList"></div>

    <section class="banner">
        <h2>Khuyến mãi lớn 50% cho tất cả sản phẩm</h2>
        <button class="shop-now btn btn-danger">Mua ngay</button>
    </section>

    <main class="container mt-5">
        <section class="products">
            <div class="product-card" data-product-id="1">
                <img src="./img/dt1.jpg" alt="Product 1">
                <h3>Điện thoại</h3>
                <p class="price">₫10,000,000</p>
            <button class="add-to-cart btn btn-primary" onclick="addToCart(1)">Thêm vào giỏ</button>
            </div>
            <div class="product-card" data-product-id="2">
                <img src="./img/laptop-4.jpg" alt="Product 2">
                <h3>Laptop</h3>
                <p class="price">₫20,000,000</p>
                <button class="add-to-cart btn btn-primary" onclick="addToCart(1)">Thêm vào giỏ</button>

            </div>
        </section>
    </main>

    <footer class="footer text-center mt-5">
        <p>© 2025 HLSHop</p>
    </footer>

    <!-- Thư viện hỗ trợ jquery -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick.min.js"></script>
    <script>
       $('.slider_for').slick({
        dots: true,
        infinite: true,
        fade: true,
        cssEase: 'linear',
        autoplay: true,         
        autoplaySpeed: 1500,    
        speed: 1500, 
        });
		
    </script>
              
    <!-- BS4 JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>

    <!-- Giỏ hàng -->
    <script src="./js/main.js"></script>
</body>

</html>
